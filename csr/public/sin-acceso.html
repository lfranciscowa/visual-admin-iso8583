<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin Acceso — Visual Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Sora', sans-serif;
            min-height: 100vh;
            background: #f0ebff;
            background-image:
                radial-gradient(ellipse 70% 60% at 15% 20%, #ddd6fe 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 85% 85%, #c7d2fe 0%, transparent 60%);
            display: flex; align-items: center; justify-content: center;
        }
        .card {
            background: white; border-radius: 24px; padding: 48px 40px;
            text-align: center; max-width: 460px; width: 90%;
            box-shadow: 0 20px 60px rgba(109,40,217,.15);
            border: 1.5px solid #ddd6fe;
            animation: fadeUp .5s cubic-bezier(.34,1.2,.64,1) both;
        }
        @keyframes fadeUp {
            from { opacity:0; transform: translateY(20px) scale(.97); }
            to   { opacity:1; transform: none; }
        }
        .icon { font-size: 56px; margin-bottom: 20px; }
        h2 { font-size: 22px; font-weight: 800; color: #1e1b4b; margin-bottom: 10px; }
        p  { font-size: 13px; color: #7c7aaa; line-height: 1.6; margin-bottom: 8px; }

        .modulos-lista {
            background: #f5f3ff; border: 1px solid #ddd6fe;
            border-radius: 12px; padding: 14px 18px;
            margin: 20px 0; text-align: left;
        }
        .modulos-lista p { font-size: 11px; font-weight: 700; text-transform: uppercase;
            color: #7c7aaa; margin-bottom: 10px; letter-spacing: .05em; }
        .mod-item {
            display: flex; align-items: center; gap: 10px;
            padding: 9px 12px; border-radius: 8px; cursor: pointer;
            transition: background .15s; margin-bottom: 6px;
            background: white; border: 1px solid #ede9fe;
            font-size: 13px; font-weight: 600; color: #1e1b4b;
            text-decoration: none;
        }
        .mod-item:last-child { margin-bottom: 0; }
        .mod-item:hover { background: #ede9fe; border-color: #8b5cf6; }

        .btn-logout {
            margin-top: 20px; width: 100%; padding: 12px;
            background: none; border: 1.5px solid #ddd6fe;
            border-radius: 10px; font-family: 'Sora', sans-serif;
            font-size: 13px; font-weight: 600; color: #7c7aaa;
            cursor: pointer; transition: .2s;
        }
        .btn-logout:hover { border-color: #ef4444; color: #ef4444; background: #fff1f2; }

        .username-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: #f5f3ff; border: 1px solid #ddd6fe;
            border-radius: 20px; padding: 5px 14px;
            font-size: 12px; font-weight: 700; color: #7c3aed;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">🔒</div>
    <span class="username-badge">👤 <span id="usernameLabel">—</span></span>
    <h2>Sin módulos asignados</h2>
    <p>Tu cuenta está activa pero no tienes módulos habilitados todavía.</p>
    <p>Contacta a un administrador para que te asigne acceso.</p>

    <div class="modulos-lista" id="modulosDisponibles" style="display:none">
        <p>Módulos que tienes disponibles</p>
        <div id="modulosLinks"></div>
    </div>

    <button class="btn-logout" onclick="cerrarSesion()">🚪 Cerrar sesión</button>
</div>

<script>
    const MODULO_URLS = {
        trama:    { url: '/dashboard.html',         icon: '⚡', nombre: 'Terminal ISO 8583'  },
        monitor:  { url: '/monitor-de-puerto.html', icon: '📡', nombre: 'Monitor de Puertos' },
        perfiles: { url: '/perfil.html',            icon: '👥', nombre: 'Gestión de Perfiles'},
    };

    const username = localStorage.getItem('username') || 'Usuario';
    document.getElementById('usernameLabel').textContent = username;

    const modulos = JSON.parse(localStorage.getItem('modulos') || '[]');

    // Si por alguna razón llegó aquí con módulos, mostrarlos
    if (modulos.length > 0) {
        const lista = document.getElementById('modulosLinks');
        modulos.forEach(id => {
            const m = MODULO_URLS[id];
            if (!m) return;
            const a = document.createElement('a');
            a.className = 'mod-item';
            a.href = m.url;
            a.innerHTML = `<span>${m.icon}</span><span>${m.nombre}</span>`;
            lista.appendChild(a);
        });
        document.getElementById('modulosDisponibles').style.display = 'block';
    }

    function cerrarSesion() {
        ['rol_actual', 'username', 'token', 'modulos'].forEach(k => localStorage.removeItem(k));
        window.location.href = '/login.html';
    }
</script>
</body>
</html>
